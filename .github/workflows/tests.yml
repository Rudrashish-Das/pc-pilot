name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # The bot targets Windows (pythonw startup, paths), so test there. No secrets needed: live suites are skipped.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -v
