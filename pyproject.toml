[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbot"
dynamic = ["version"]
description = "Discord and Telegram bot for a local LLM (Ollama) and the Claude Code CLI, running on your own PC."
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }  # LICENSE.md: free for personal use, no commercial use
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
    "aiohttp>=3.9",  # the web dashboard (discord.py needs it too)
    "zeroconf>=0.132",  # announces the dashboard as llmbot.local
    "cryptography>=42",  # the dashboard's self-signed https certificate (phones need https for the microphone)
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "trafilatura>=1.12",
    "ddgs>=9.0",
    "tzdata; sys_platform == 'win32'",
    "faster-whisper>=1.1",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llmbot = "llmbot.core:main"

[tool.setuptools]
packages = ["llmbot"]

[tool.setuptools.package-data]
llmbot = ["*.html", "*.png"]

[tool.setuptools.dynamic]
version = { attr = "llmbot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
