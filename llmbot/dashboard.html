<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<title>Bot dashboard</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/logo.png">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #646a76; --line: #e3e5ea; --chip: #eef0f4;
  --accent: #5865f2; --ok: #1a9a55; --warn: #b7791f; --err: #d93a3f; --run: #2f6fde;
  --ok-bg: #e6f6ed; --warn-bg: #fdf3e1; --err-bg: #fde8e8; --run-bg: #e7effd;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --card: #171a21; --text: #e7e9ee; --muted: #9098a6; --line: #262a34; --chip: #222631;
    --accent: #8891ff; --ok: #43c47f; --warn: #e3a64a; --err: #ff6b6f; --run: #6ea1ff;
    --ok-bg: #16281f; --warn-bg: #2d2415; --err-bg: #331a1c; --run-bg: #17223a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar { max-width: var(--page); margin: 0 auto; padding: 10px var(--gutter) 0; }
.title { display: flex; align-items: center; gap: 10px; }
.title h1 { font-size: 17px; margin: 0; font-weight: 650; }
.title .logo { width: 30px; height: 30px; flex: none; display: block; }
.title .sub { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.err { background: var(--err); } .dot.run { background: var(--run); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
nav { display: flex; gap: 4px; overflow-x: auto; padding: 8px 0 0; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { font: inherit; font-size: 14px; border: 0; background: none; color: var(--muted); padding: 8px 12px 10px;
  border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
nav button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
nav .n { font-size: 11px; background: var(--chip); border-radius: 9px; padding: 1px 6px; margin-left: 4px; }
main { max-width: var(--page); margin: 0 auto; padding: 14px var(--gutter) 40px; }
/* Width: phones and laptops as before; big monitors get more columns instead of one stretched one. */
:root { --page: 1000px; --gutter: 16px; }
@media (min-width: 1200px) { :root { --page: 1480px; --gutter: 28px; } }
@media (min-width: 1800px) { :root { --page: 2400px; --gutter: 40px; } }
/* 4K at 100 % Windows scaling (3000+ CSS px wide): everything would be tiny, so scale the page up. */
@media (min-width: 3000px) { html { zoom: 1.25; } }
section { display: none; } section.on { display: block; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
@media (min-width: 1200px) { .grid { gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.card.wide { grid-column: 1 / -1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.kv > :nth-child(odd) { color: var(--muted); }
.kv > :nth-child(even) { text-align: right; overflow-wrap: anywhere; }
.big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; } .mono { font-family: var(--mono); font-size: 12.5px; }
.meter { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin: 6px 0 2px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.hot > i { background: var(--warn); } .meter.full > i { background: var(--err); }
.row { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 10px;
  background: var(--chip); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.err { background: var(--err-bg); color: var(--err); } .badge.run { background: var(--run-bg); color: var(--run); }
.live { border-color: color-mix(in srgb, var(--run) 45%, var(--line)); }
.lines { margin: 10px 0 0; padding: 8px 10px; background: var(--chip); border-radius: 10px; max-height: 240px; overflow: auto; }
.lines div { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; padding: 1px 0; }
.task { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.list { display: flex; flex-direction: column; }
.item { padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.item:first-child { border-top: 0; padding-top: 2px; }
.item .head { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.item .head .t { margin-left: auto; font-variant-numeric: tabular-nums; }
.item .body { margin-top: 3px; overflow-wrap: anywhere; white-space: pre-wrap; }
.item .body.clip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.item .more { margin-top: 6px; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere;
  border-left: 2px solid var(--line); padding-left: 10px; display: none; }
.item.open .more { display: block; } .item.open .body.clip { -webkit-line-clamp: unset; display: block; }
.item[data-expand] { cursor: pointer; }
.day { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 6px; }
.day:first-child { margin-top: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 16px; padding: 5px 12px; white-space: nowrap; cursor: pointer; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tools { display: flex; gap: 8px; margin-bottom: 10px; }
input[type=search] { font: inherit; flex: 1; min-width: 0; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); }
.btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.center { text-align: center; margin-top: 12px; }
.log { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.log div { padding: 1px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.log .WARNING { color: var(--warn); } .log .ERROR, .log .CRITICAL { color: var(--err); }
.banner { border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); } .banner.err { background: var(--err-bg); color: var(--err); }
.hide { display: none !important; }
.totals { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 14px; }
.totals b { font-variant-numeric: tabular-nums; }
/* big screens: sidebars, columns, readable line lengths */
.chatside { display: none; }
@media (min-width: 1200px) {
  .split { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; align-items: start; }
  .split .side { position: sticky; top: calc(var(--head, 100px) + 14px); }
  .split .side .chips { flex-direction: column; align-items: stretch; overflow: visible; }
  .split .side .chips button { text-align: left; border-radius: 10px; }
  #feed .item .body, #feed .item .more { max-width: 130ch; }
  #joblist { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); column-gap: 28px; }
  #joblist .item, #joblist .item:first-child { border-top: 0; border-bottom: 1px solid var(--line); padding: 10px 0; }
  .chatlayout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; }
  .chatside { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; height: var(--chat-h, calc(100dvh - var(--head, 100px) - 14px)); padding-right: 4px; }
  .chatside .new { margin-bottom: 6px; }
  .chatside .c { text-align: left; font: inherit; border: 1px solid transparent; background: none; color: var(--text);
    border-radius: 10px; padding: 8px 10px; cursor: pointer; min-width: 0; }
  .chatside .c:hover { background: var(--chip); }
  .chatside .c.on { background: var(--card); border-color: var(--line); }
  .chatside .c b { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatside .c span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat-pick, #chat-new { display: none; }
  .chatbar { justify-content: flex-end; }
  .msg { max-width: min(80%, 980px); }
  .msgs { padding-left: 8px; padding-right: 8px; }
}
@media (min-width: 1800px) {
  .card.latest { grid-column: span 2; }
  .chatlayout { grid-template-columns: 320px minmax(0, 1600px); justify-content: center; }
}
/* scroll bars: thin, in the theme's colours, no arrow buttons */
@supports not selector(::-webkit-scrollbar) {  /* Firefox; Chrome would ignore the ::-webkit rules (and show arrows) */
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 45%, transparent) transparent; }
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 45%, transparent); border-radius: 8px;
  border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--muted) 70%, transparent); }
::-webkit-scrollbar-button { display: none; }
.composer textarea { scrollbar-width: none; }
.composer textarea::-webkit-scrollbar { display: none; }
/* chat */
body.chatting main { padding-bottom: 0; }
body.chatting #offline { margin-bottom: 8px; }
.chatwrap { display: flex; flex-direction: column; height: var(--chat-h, calc(100dvh - var(--head, 100px) - 14px)); min-height: 320px; }
.chatbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.chatbar select { font: inherit; font-size: 14px; flex: 1; min-width: 0; padding: 7px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); }
.chatbar .btn { padding: 7px 11px; flex: none; }
.engine { font-size: 12.5px; color: var(--muted); margin: -2px 0 8px; cursor: pointer; }
.engine b { color: var(--text); font-weight: 600; }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px;
  overscroll-behavior: contain; }
.msg { max-width: min(88%, 720px); min-width: 0; }
.msg.user { align-self: flex-end; }
.msg.bot { align-self: flex-start; }
.bubble { padding: 9px 13px; border-radius: 16px; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
.msg.bot .bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg.eph .bubble { border-style: dashed; }
.msg .meta { font-size: 11.5px; color: var(--muted); margin: 3px 6px 0; }
.msg.user .meta { text-align: right; }
.md p { margin: 0; white-space: pre-wrap; }
.md p + p, .md pre + p, .md p + pre, .md .quote + p { margin-top: 6px; }
.md pre { margin: 6px 0; padding: 8px 10px; border-radius: 8px; background: var(--chip); overflow-x: auto;
  font-family: var(--mono); font-size: 12.5px; white-space: pre; }
.msg.user .md pre, .msg.user .md code { background: rgba(255, 255, 255, .18); }
.md code { font-family: var(--mono); font-size: .9em; background: var(--chip); padding: 1px 5px; border-radius: 5px; }
.md .grey { font-size: 12px; color: var(--muted); }
.msg.user .md .grey { color: rgba(255, 255, 255, .8); }
.md .h { font-weight: 700; }
.md .quote { border-left: 3px solid var(--line); padding-left: 9px; color: var(--muted); }
.md a { color: inherit; text-decoration: underline; }
.md .spoiler { background: var(--muted); color: transparent; border-radius: 4px; cursor: pointer; }
.md .spoiler.shown { background: var(--chip); color: inherit; }
.embed { border-left: 4px solid var(--accent); padding: 2px 0 2px 10px; margin-top: 4px; }
.embed .et { font-weight: 650; margin-bottom: 3px; }
.embed .ef { margin-top: 6px; }
.embed .ef b { display: block; font-size: 13px; }
.embed .eft { font-size: 12px; color: var(--muted); margin-top: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.controls .brk { flex-basis: 100%; height: 0; }
.controls button, .controls select, .controls a { font: inherit; font-size: 13.5px; border-radius: 9px; padding: 6px 11px;
  border: 1px solid var(--line); background: var(--chip); color: var(--text); cursor: pointer; text-decoration: none; }
.controls select { max-width: 100%; }
.controls .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.controls .success { background: var(--ok); border-color: var(--ok); color: #fff; }
.controls .danger { background: var(--err); border-color: var(--err); color: #fff; }
.controls :disabled { opacity: .45; cursor: default; }
.files { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.files img { max-width: 100%; max-height: 320px; border-radius: 10px; display: block; }
.files a { color: inherit; font-size: 13.5px; }
.working .lines { margin-top: 6px; max-height: 160px; }
.dots::after { content: "…"; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 8px 0 max(10px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); background: var(--bg); }
.composer textarea { font: inherit; flex: 1; min-width: 0; resize: none; max-height: 160px; padding: 9px 12px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
.composer .btn { padding: 9px 12px; }
.composer .send { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.cmds { border: 1px solid var(--line); background: var(--card); border-radius: 12px; margin-bottom: 6px;
  max-height: 260px; overflow-y: auto; box-shadow: 0 -6px 20px #0002; }
.cmds div { padding: 8px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.cmds div + div { border-top: 1px solid var(--line); }
.cmds div.on { background: var(--chip); }
.cmds b { font-family: var(--mono); font-size: 13.5px; white-space: nowrap; }
.cmds .args { color: var(--muted); font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.cmds .d { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
.composer .mic.rec { background: var(--err); border-color: var(--err); color: #fff; animation: pulse 1.4s infinite;
  font-variant-numeric: tabular-nums; }
.composer .mic.busy { opacity: .6; }
.attached { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; padding-top: 6px; }
.attached span { background: var(--chip); border-radius: 8px; padding: 2px 8px; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 20; max-width: min(92vw, 480px);
  background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 24px #0004; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); width: min(92vw, 520px); }
dialog::backdrop { background: #0007; }
dialog textarea { font: inherit; width: 100%; min-height: 140px; margin: 8px 0; padding: 8px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
dialog .row { justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title"><img class="logo" src="/logo.png" alt=""><h1>Bot dashboard</h1><span class="dot" id="dot"></span><span class="sub" id="sub">loading…</span></div>
    <nav id="tabs">
      <button data-tab="chat" id="tab-chat">Chat</button>
      <button data-tab="now" class="on">Now</button>
      <button data-tab="activity">Activity</button>
      <button data-tab="jobs">Claude jobs</button>
      <button data-tab="schedule">Scheduled <span class="n" id="n-sched">0</span></button>
      <button data-tab="log">Log</button>
    </nav>
  </div>
</header>
<main>
  <div class="banner err hide" id="offline"></div>
  <section id="chat">
    <div class="chatlayout">
    <aside class="chatside" id="chat-side"></aside>
    <div class="chatwrap">
      <div class="chatbar">
        <select id="chat-pick" aria-label="Chat"></select>
        <button class="btn" id="chat-new" title="New chat">＋</button>
        <button class="btn" id="chat-panel" title="Engine, models, settings">⚙️</button>
        <button class="btn" id="chat-more" title="Rename or delete this chat">⋯</button>
      </div>
      <div class="engine" id="chat-engine" title="Change in ⚙️"></div>
      <div class="msgs" id="msgs"></div>
      <div class="composer-wrap">
        <div class="cmds hide" id="cmds" role="listbox"></div>
        <div class="attached" id="attached"></div>
        <form class="composer" id="composer">
          <input type="file" id="chat-files" multiple hidden>
          <input type="file" id="chat-audio" accept="audio/*" capture hidden>
          <button type="button" class="btn" id="chat-attach" title="Attach files">📎</button>
          <button type="button" class="btn mic" id="chat-mic" title="Speak: turned into text on the PC">🎙️</button>
          <textarea id="chat-input" rows="1" placeholder="Message the bot" enterkeyhint="send"></textarea>
          <button class="btn send" id="chat-send">Send</button>
        </form>
      </div>
    </div>
    </div>
  </section>
  <dialog id="modal"><form method="dialog" id="modal-form"><b id="modal-title"></b><div class="small muted" id="modal-label"></div>
    <textarea id="modal-text"></textarea>
    <div class="row"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn send" value="ok" id="modal-ok">Submit</button></div></form></dialog>
  <section id="now" class="on">
    <div class="banner warn hide" id="power"></div>
    <div class="grid">
      <div class="card wide" id="busy-card"><h2>Right now</h2><div id="busy"></div></div>
      <div class="card"><h2>Claude Code spend today</h2><div id="spend"></div></div>
      <div class="card"><h2>Models in memory</h2><div id="models"></div></div>
      <div class="card"><h2>Installed models</h2><div id="installed"></div></div>
      <div class="card"><h2>PC</h2><div id="machine"></div></div>
      <div class="card"><h2>Bot</h2><div id="botinfo"></div></div>
      <div class="card"><h2>Coming up</h2><div id="next"></div></div>
      <div class="card latest"><h2>Latest</h2><div id="latest" class="list"></div></div>
    </div>
  </section>
  <section id="activity">
    <div class="split">
      <aside class="side">
        <div class="tools"><input type="search" id="q" placeholder="Search activity"></div>
        <div class="chips" id="filters"></div>
      </aside>
      <div class="split-main">
        <div class="card"><div id="feed"></div></div>
        <div class="center"><button class="btn" id="older">Load older</button></div>
      </div>
    </div>
  </section>
  <section id="jobs">
    <div class="totals" id="job-totals"></div>
    <div class="card"><div id="joblist" class="list"></div></div>
    <div class="center"><button class="btn" id="older-jobs">Load older</button></div>
  </section>
  <section id="schedule">
    <div class="grid">
      <div class="card"><h2>Reminders</h2><div id="reminders" class="list"></div></div>
      <div class="card"><h2>Scheduled prompts</h2><div id="tasks" class="list"></div></div>
    </div>
  </section>
  <section id="log">
    <div class="chips" id="log-filters"></div>
    <div class="card"><div class="log" id="logbox"></div></div>
  </section>
</main>
<script>
"use strict";
// Everything from the bot is set with textContent (never innerHTML): chat text can't inject markup.
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const put = (el, ...kids) => { el.replaceChildren(...kids.flat().filter((k) => k != null && k !== false)); };

const S = { tab: "now", events: [], lastId: 0, state: null, filter: "all", q: "", oldestId: null, noMore: false,
  jobs: [], jobsLoaded: 0, logLevel: "all", skew: 0, failures: 0 };

// ---- formatting
const nowS = () => Date.now() / 1000 - S.skew;
function ago(ts) {
  const d = nowS() - ts;
  if (d < 45) return "just now";
  if (d < 3600) return Math.round(d / 60) + " min ago";
  if (d < 86400) return Math.round(d / 3600) + " h ago";
  return Math.round(d / 86400) + " d ago";
}
function until(ts) {
  const d = ts - nowS();
  if (d <= 0) return "due now";
  if (d < 3600) return "in " + Math.max(1, Math.round(d / 60)) + " min";
  if (d < 86400) return "in " + (d / 3600).toFixed(d < 36000 ? 1 : 0) + " h";
  return "in " + Math.round(d / 86400) + " d";
}
function dur(s) {
  s = Math.round(s || 0);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
  if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
  return Math.floor(s / 86400) + "d " + Math.floor((s % 86400) / 3600) + "h";
}
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const when = (ts) => {
  const d = new Date(ts * 1000), t = new Date();
  return d.toDateString() === t.toDateString() ? clock(ts)
    : d.toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
};
const iso = (s) => (s ? Date.parse(s) / 1000 : null);
function dayLabel(ts) {
  const d = new Date(ts * 1000), t = new Date(), y = new Date(Date.now() - 86400000);
  if (d.toDateString() === t.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
}
const usd = (x) => (x == null ? "—" : "$" + (x < 0.01 && x > 0 ? x.toFixed(4) : x.toFixed(2)));
const gb = (x) => (x == null ? "—" : x.toFixed(1) + " GB");
function meter(frac, label) {
  const f = Math.max(0, Math.min(1, frac || 0));
  return h("div", {}, h("div", { class: "meter" + (f >= 0.95 ? " full" : f >= 0.8 ? " hot" : "") }, h("i", { style: `width:${(f * 100).toFixed(1)}%` })),
    label ? h("div", { class: "small muted" }, label) : null);
}
const kv = (pairs) => h("div", { class: "kv" }, pairs.filter(Boolean).flatMap(([k, v]) => [h("span", {}, k), h("span", {}, v)]));

// ---- event kinds
const KINDS = {
  local: { label: "Local", icon: "💻" }, claude: { label: "Claude Code", icon: "🤖" }, reminder: { label: "Reminder", icon: "⏰" },
  task: { label: "Task", icon: "🗓️" }, power: { label: "Power", icon: "🔌" }, model: { label: "Model", icon: "🧠" },
  voice: { label: "Voice", icon: "🎙️" }, bot: { label: "Bot", icon: "🟢" }, warning: { label: "Warning", icon: "⚠️" },
  error: { label: "Error", icon: "⛔" },
};
const FILTERS = [
  ["all", "All", () => true],
  ["chats", "Chats", (e) => e.kind === "local" || e.kind === "claude"],
  ["claude", "Claude Code", (e) => e.kind === "claude"],
  ["local", "Local model", (e) => e.kind === "local"],
  ["reminders", "Reminders & tasks", (e) => e.kind === "reminder" || e.kind === "task"],
  ["system", "System", (e) => ["bot", "model", "power", "voice"].includes(e.kind)],
  ["problems", "Problems", (e) => e.level === "error" || e.level === "warning"],
];

function statusBadge(e) {
  const s = e.status;
  if (e.level === "error") return h("span", { class: "badge err" }, s || "error");
  if (e.level === "warning") return h("span", { class: "badge warn" }, "warning");
  if (!s) return null;
  const cls = { success: "ok", fired: "ok", ran: "ok", set: "run", scheduled: "run", changed: "run", late: "warn", stopped: "warn", cancelled: "" }[s];
  return h("span", { class: "badge " + (cls || "") }, s);
}

function eventItem(e) {
  const k = KINDS[e.kind] || { label: e.kind, icon: "•" };
  const bits = [];
  if (e.model) bits.push(e.model);
  if (e.seconds != null) bits.push(dur(e.seconds));
  if (e.cost != null) bits.push(usd(e.cost));
  if (e.turns != null) bits.push(e.turns + " turns");
  if (e.tools) bits.push("used " + [].concat(e.tools).join(", "));
  if (e.due && e.status !== "fired") bits.push("due " + when(iso(e.due)));
  if (e.cron) bits.push("cron " + e.cron);
  if (e.scheduled) bits.push("scheduled run");
  if (e.source) bits.push(e.source);
  const more = [];
  if (e.reply) more.push(h("div", {}, "↳ " + e.reply));
  if (e.error) more.push(h("div", { style: "color:var(--err)" }, e.error));
  if (e.notices) more.push(h("div", {}, [].concat(e.notices).join("\n")));
  if (e.job) more.push(h("div", { class: "mono" }, "job " + e.job + (e.backend ? " · " + e.backend : "") + (e.perm ? " · " + e.perm : "") + (e.context ? " · " + e.context + " ctx tokens" : "")));
  const expandable = more.length > 0 || (e.text || "").length > 180;
  const el = h("div", { class: "item", "data-expand": expandable ? "1" : null },
    h("div", { class: "head" }, h("span", {}, k.icon + " " + k.label), statusBadge(e),
      e.who ? h("span", {}, e.who) : null, e.where ? h("span", {}, "· " + e.where) : null,
      h("span", { class: "t", title: new Date(at(e) * 1000).toLocaleString() }, clock(at(e)))),
    h("div", { class: "body" + (expandable ? " clip" : "") }, e.text || ""),
    bits.length ? h("div", { class: "small muted", style: "margin-top:3px" }, bits.join(" · ")) : null,
    more.length ? h("div", { class: "more" }, more) : null);
  if (expandable) el.addEventListener("click", (ev) => { if (!getSelection().toString()) el.classList.toggle("open"); });
  return el;
}

// ---- fetching
async function getJSON(url) {
  const r = await fetch(url, { credentials: "same-origin", cache: "no-store" });
  if (r.status === 401) { location.href = "/"; throw new Error("signed out"); }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// When it happened: a reply is logged when it finishes but belongs where the request came in (started), so what it
// did along the way (a task scheduled, a reminder set) shows after the request, not before it.
const at = (e) => e.started || e.ts;

function mergeEvents(list) {
  const seen = new Set(S.events.map((e) => e.id));
  for (const e of list) if (!seen.has(e.id)) S.events.push(e);
  S.events.sort((a, b) => at(b) - at(a) || b.id - a.id);
  if (S.events.length) {
    const ids = S.events.map((e) => e.id);  // ids stay in logging order: polling and paging go by them
    S.lastId = Math.max(S.lastId, ...ids);
    S.oldestId = Math.min(...ids);
  }
}

async function poll() {
  try {
    // Off the Now tab, "lite": no GPU/CPU/model stats (the PC skips nvidia-smi); the last ones are kept.
    const st = await getJSON("/api/state?since=" + S.lastId + (S.tab === "now" ? "" : "&lite=1"));
    S.skew = Date.now() / 1000 - st.now;
    S.state = { ...(S.state || {}), ...st };
    mergeEvents(st.events || []);
    S.failures = 0;
    $("offline").classList.add("hide");
    render();
  } catch (err) {
    if (++S.failures >= 2) {
      $("offline").textContent = "Can't reach the bot (" + err.message + "). It may be stopped, or the PC is asleep. Retrying…";
      $("offline").classList.remove("hide");
      $("dot").className = "dot err";
    }
  }
}

// ---- rendering
function render() {
  const st = S.state;
  if (!st) return;
  const b = st.bot, busy = st.busy;
  const working = busy.claude || busy.inflight.length || busy.local_locked;
  const fe = b.frontends || [];
  $("dot").className = "dot " + (working ? "run" : fe.length && fe.every((f) => f.ok) ? "ok" : "err");
  $("sub").textContent = (working ? "working" : "idle") + " · up " + dur(st.now - b.started);
  $("n-sched").textContent = st.reminders.length + st.tasks.length;
  if (S.tab === "now") renderNow();
  if (S.tab === "activity" && changed("feed", [S.events.length, S.lastId, S.oldestId])) renderFeed();
  if (S.tab === "schedule" && changed("schedule", [st.tasks, st.reminders, Math.floor(nowS() / 60)])) renderSchedule();
}

// Each section is redrawn only when what it shows changed (the page polls every few seconds; most polls change
// nothing, and rebuilding the DOM costs battery on a phone). "minute" makes relative times ("in 25 min") tick.
S.sig = {};
function changed(key, value) {
  const s = JSON.stringify(value);
  if (S.sig[key] === s) return false;
  S.sig[key] = s;
  return true;
}

function renderNow() {
  const st = S.state, busy = st.busy, minute = Math.floor(nowS() / 60);
  // power
  const p = busy.power;
  if (changed("power", [p, minute])) {
  $("power").classList.toggle("hide", !p);
  if (p) $("power").textContent = `🔌 ${p.action} requested ${ago(p.at)}${p.who ? " by " + p.who : ""}. The bot posts in the chat when it's back.`;
  }
  // right now
  const j = busy.claude;
  if (changed("busy", [j, busy.inflight, busy.claude_waiting, busy.local_locked, j || busy.inflight.length ? Math.floor(st.now) : 0])) {
  const kids = [];
  $("busy-card").classList.toggle("live", !!(j || busy.inflight.length));
  if (j) {
    kids.push(h("div", {},
      h("div", { class: "row" }, h("span", {}, h("span", { class: "badge run" }, j.stopping ? "stopping" : j.status), " 🤖 Claude Code · ", j.model),
        h("span", { class: "muted small" }, dur(j.seconds))),
      h("div", { class: "small muted", style: "margin-top:4px" }, [j.who, j.where, j.perm, j.workspace, j.scheduled ? "scheduled" : null, j.context ? j.context + " ctx tokens" : null].filter(Boolean).join(" · ")),
      h("div", { class: "task" }, j.task),
      j.lines.length ? h("div", { class: "lines" }, j.lines.map((l) => h("div", {}, l))) : null));
  }
  for (const a of busy.inflight) {
    const k = KINDS[a.kind] || { icon: "•", label: a.kind };
    kids.push(h("div", { style: kids.length ? "margin-top:14px" : "" },
      h("div", { class: "row" }, h("span", {}, h("span", { class: "badge run" }, "running"), " ", k.icon, " ", k.label, a.model ? " · " + a.model : ""),
        h("span", { class: "muted small" }, dur(st.now - a.started))),
      h("div", { class: "small muted", style: "margin-top:4px" }, [a.who, a.where].filter(Boolean).join(" · ")),
      h("div", { class: "task" }, a.text)));
  }
  if (busy.claude_waiting) kids.push(h("div", { class: "small muted", style: "margin-top:10px" }, `${busy.claude_waiting} Claude Code job(s) waiting in line`));
  if (!kids.length) kids.push(h("div", { class: "empty" }, busy.local_locked ? "The local model is busy." : "Idle. Nothing is running."));
  put($("busy"), kids);
  }
  // spend
  const sp = st.spend;
  if (changed("spend", sp)) put($("spend"), h("div", { class: "big" }, usd(sp.today)),
    sp.daily_budget > 0 ? meter(sp.today / sp.daily_budget, `of ${usd(sp.daily_budget)} daily cap · ${sp.jobs_today} job(s) today`)
      : h("div", { class: "small muted" }, `${sp.jobs_today} job(s) today · no daily cap`),
    h("div", { class: "small muted", style: "margin-top:6px" }, `API-equivalent cost on the Anthropic backend. Per-job cap ${usd(sp.job_budget)}.`));
  // models
  const ms = st.models || [];
  if (changed("models", [ms, st.ollama_up, busy.whisper_loaded])) put($("models"),
    ms.length ? h("div", { class: "list" }, ms.map((m) => h("div", { class: "item" },
      h("div", { class: "row" }, h("b", {}, m.name), h("span", { class: "small muted" }, m.until ? "until " + clock(iso(m.until)) : "")),
      h("div", { class: "small muted" }, `${(m.size_mb / 1024).toFixed(1)} GB · ${m.size_mb ? Math.round((m.vram_mb / m.size_mb) * 100) : 0}% on GPU` + (m.context ? ` · ${Math.round(m.context / 1024)}k ctx` : "")))))
      : h("div", { class: "empty" }, st.ollama_up === false ? "Ollama isn't reachable." : "None loaded (they load on the next message)."),
    busy.whisper_loaded ? h("div", { class: "small muted", style: "margin-top:8px" }, "🎙️ Whisper (voice notes) is loaded") : null);
  // installed
  const inst = st.installed;
  if (inst && changed("installed", [inst, ms.map((m) => m.name), st.ollama_up])) {
    const bare = (n) => (n || "").replace(/:latest$/, "");
    const loaded = new Set(ms.map((m) => bare(m.name)));
    const local = inst.local.map((m) => h("div", { class: "item" },
      h("div", { class: "row" }, h("b", {}, m.name),
        h("span", {}, bare(m.name) === bare(inst.default_local) ? h("span", { class: "badge" }, "default") : null,
          loaded.has(bare(m.name)) ? h("span", { class: "badge ok", style: "margin-left:4px" }, "loaded") : null)),
      m.size_gb != null ? h("div", { class: "small muted" }, [m.params, m.quant, m.size_gb + " GB on disk", m.family].filter(Boolean).join(" · ")) : null));
    const cc = inst.claude.map((c) => h("div", { class: "item" },
      h("div", { class: "row" }, h("b", {}, "Claude Code · " + c.backend),
        c.backend.toLowerCase() === inst.claude_backend ? h("span", { class: "badge" }, "default backend") : null),
      h("div", { class: "small muted" }, c.models.map((n) => (n === inst.default_claude && c.backend.toLowerCase() === inst.claude_backend ? n + " (default)" : n)).join(" · "))));
    put($("installed"),
      h("div", { class: "small muted", style: "margin-bottom:4px" }, `Local models (${inst.local.length})`),
      local.length ? h("div", { class: "list" }, local) : h("div", { class: "empty" }, st.ollama_up === false ? "The local model server isn't reachable." : "None installed. Add one with: ollama pull qwen3.5:9b"),
      cc.length ? h("div", { class: "list", style: "margin-top:10px" }, cc) : null,
      inst.claude.length && inst.local.length ? h("div", { class: "small muted", style: "margin-top:6px" }, "Claude Code can also run on the local models (Ollama backend in /panel).") : null,
      inst.whisper ? h("div", { class: "small muted", style: "margin-top:6px" }, `🎙️ Voice notes: Whisper ${inst.whisper}`) : null);
  }
  // machine
  const mc = st.machine || {};
  if (changed("machine", mc)) {
  const rows = [];
  const bar = (label, value, frac, note) => rows.push(h("div", { style: rows.length ? "margin-top:8px" : "" },
    h("div", { class: "row small" }, h("span", {}, label), h("span", {}, value)), meter(frac, note)));
  const gpus = mc.gpu || [];
  if (mc.cpu) bar("CPU load", mc.cpu.percent.toFixed(0) + "%", mc.cpu.percent / 100, mc.cpu.cores ? `${mc.cpu.cores} logical cores` : null);
  for (const g of gpus) {
    if (g.util != null) bar("GPU load", g.util.toFixed(0) + "%", g.util / 100, g.name + (g.temp_c != null ? ` · ${g.temp_c}°C` : ""));
  }
  if (mc.ram) bar("Memory", `${gb(mc.ram.used_gb)} / ${gb(mc.ram.total_gb)}`, mc.ram.used_gb / mc.ram.total_gb);
  for (const g of gpus) {
    if (g.mem_total_mb) bar("GPU memory", `${(g.mem_used_mb / 1024).toFixed(1)} / ${(g.mem_total_mb / 1024).toFixed(1)} GB`, g.mem_used_mb / g.mem_total_mb);
  }
  const facts = [];
  if (mc.battery) facts.push(["Battery", (mc.battery.percent != null ? mc.battery.percent + "%" : "—") + (mc.battery.plugged_in ? " · plugged in" : " · on battery")]);
  if (mc.disk) facts.push(["Disk free", `${mc.disk.free_gb} of ${mc.disk.total_gb} GB`]);
  if (mc.host) facts.push(["Name", mc.host]);
  put($("machine"), rows, facts.length ? h("div", { style: rows.length ? "margin-top:10px" : "" }, kv(facts)) : null);
  }
  // bot
  const b = st.bot;
  if (changed("bot", b)) put($("botinfo"), kv([
    ...b.frontends.map((f) => [f.name, h("span", {}, h("span", { class: "badge " + (f.ok ? "ok" : "err") }, f.ok ? "online" : "offline"), " ", f.detail)]),
    ["Up since", when(b.started)],
    ["Default engine", b.default_engine + " · " + b.local_model],
    ["Claude Code", b.cc.enabled ? `${b.cc.backend} · ${b.cc.model}` + (b.claude ? ` · CLI ${b.claude}` : "") : "disabled"],
    ["Storage", b.storage],
    ["Version", b.version],
  ]));
  // coming up
  if (changed("next", [st.reminders, st.tasks, minute])) {
  const up = [
    ...st.reminders.map((r) => ({ ts: iso(r.when), icon: "⏰", text: r.text, sub: r.who })),
    ...st.tasks.filter((t) => t.next).map((t) => ({ ts: iso(t.next), icon: t.engine === "claude" ? "🤖" : "💻", text: t.description, sub: t.cron ? "cron " + t.cron : "once" })),
  ].sort((a, b) => a.ts - b.ts).slice(0, 4);
  put($("next"), up.length ? h("div", { class: "list" }, up.map((u) => h("div", { class: "item" },
    h("div", { class: "row small" }, h("span", {}, u.icon + " " + when(u.ts)), h("span", { class: "muted" }, until(u.ts))),
    h("div", { class: "body clip" }, u.text)))) : h("div", { class: "empty" }, "No reminders or scheduled prompts."));
  }
  // latest
  const n = innerWidth >= 1800 ? 10 : 5;
  if (changed("latest", [S.events.slice(0, n).map((e) => e.id), n])) {
    put($("latest"), S.events.slice(0, n).map(eventItem));
    if (!S.events.length) put($("latest"), h("div", { class: "empty" }, "Nothing yet."));
  }
}

function renderFeed() {
  const f = FILTERS.find((x) => x[0] === S.filter)[2];
  const q = S.q.trim().toLowerCase();
  const list = S.events.filter(f).filter((e) => !q || [e.text, e.reply, e.who, e.where, e.model, e.error].some((x) => x && String(x).toLowerCase().includes(q)));
  const out = [];
  let day = null, group = null;
  for (const e of list) {
    const d = dayLabel(at(e));
    if (d !== day) { day = d; out.push(h("div", { class: "day" }, d)); group = h("div", { class: "list" }); out.push(group); }
    group.append(eventItem(e));
  }
  // keep expanded items expanded across refreshes
  const open = new Set([...$("feed").querySelectorAll(".item.open")].map((el) => el.dataset.id));
  put($("feed"), out.length ? out : h("div", { class: "empty" }, q || S.filter !== "all" ? "Nothing matches." : "No activity yet."));
  let i = 0;
  for (const el of $("feed").querySelectorAll(".item")) { el.dataset.id = list[i].id; if (open.has(String(list[i].id))) el.classList.add("open"); i++; }
  $("older").classList.toggle("hide", S.noMore);
}

function renderSchedule() {
  const st = S.state;
  put($("reminders"), st.reminders.length ? st.reminders.map((r) => h("div", { class: "item" },
    h("div", { class: "head" }, h("span", {}, "⏰ " + when(iso(r.when))), h("span", { class: "badge run" }, until(iso(r.when))), h("span", { class: "t" }, r.id)),
    h("div", { class: "body" }, r.text),
    h("div", { class: "small muted" }, [r.who, r.where].filter(Boolean).join(" · ")))) : h("div", { class: "empty" }, "No reminders."));
  put($("tasks"), st.tasks.length ? st.tasks.map((t) => openable("t:" + t.id, h("div", { class: "item", "data-expand": "1" },
    h("div", { class: "head" }, h("span", {}, (t.engine === "claude" ? "🤖 " : "💻 ") + (t.cron ? "cron " + t.cron : "once")),
      t.next ? h("span", { class: "badge run" }, "next " + until(iso(t.next))) : null, h("span", { class: "t" }, t.id)),
    h("div", { class: "body" }, t.description),
    h("div", { class: "small", style: "margin-top:3px" },
      [t.model, t.engine === "claude" && t.backend && t.backend !== "anthropic" ? "on " + t.backend : null].filter(Boolean).join(" ") || "—", " ",
      h("span", { class: "badge " + (t.perm === "full" ? "err" : t.perm === "edit" ? "warn" : "") }, { read: "read-only", edit: "can edit files", full: "full access" }[t.perm] || t.perm),
      t.reminders ? h("span", { class: "badge run", style: "margin-left:4px" }, "can set reminders") : null),
    h("div", { class: "small muted" }, [t.next ? when(iso(t.next)) : null, t.who, t.where].filter(Boolean).join(" · ")),
    h("div", { class: "more" }, t.prompt,
      t.workspace || t.approved_by ? h("div", { class: "mono", style: "margin-top:6px" },
        [t.workspace ? "workspace " + t.workspace : null, t.approved_by ? "approved by " + t.approved_by : null].filter(Boolean).join(" · ")) : null))))
    : h("div", { class: "empty" }, "No scheduled prompts."));
}

// Lists are rebuilt on every refresh, so which items are expanded is remembered here, by a stable key.
S.open = new Set();
function openable(key, el) {
  if (S.open.has(key)) el.classList.add("open");
  el.addEventListener("click", () => {
    if (getSelection().toString()) return;  // selecting text to copy isn't a click to collapse
    el.classList.toggle("open");
    if (el.classList.contains("open")) S.open.add(key); else S.open.delete(key);
  });
  return el;
}

async function loadOlder() {
  if (S.noMore) return;
  $("older").disabled = true;
  try {
    const r = await getJSON("/api/events?limit=150" + (S.oldestId ? "&before=" + S.oldestId : ""));
    if (r.events.length < 150) S.noMore = true;
    mergeEvents(r.events);
    renderFeed();
  } finally { $("older").disabled = false; }
}

const LOG_LEVELS = [["all", "All"], ["INFO", "Info+"], ["WARNING", "Warnings+"], ["ERROR", "Errors"]];
async function loadLog() {
  const r = await getJSON("/api/log?lines=400");
  const rank = { DEBUG: 0, INFO: 1, WARNING: 2, ERROR: 3, CRITICAL: 4 };
  const min = S.logLevel === "all" ? -1 : rank[S.logLevel];
  // Group lines into records (a record's traceback lines stay under it, in order), then show newest first.
  const records = [];
  for (const line of r.lines) {
    const m = line.match(/^\d{4}-\d\d-\d\d [\d:,]+ (DEBUG|INFO|WARNING|ERROR|CRITICAL)\b/);
    if (m || !records.length) records.push({ level: m ? m[1] : "INFO", lines: [line] });
    else records[records.length - 1].lines.push(line);
  }
  const rows = records.reverse().filter((rec) => (rank[rec.level] ?? 1) >= min)
    .map((rec) => h("div", { class: rec.level }, rec.lines.join("\n")));
  put($("logbox"), rows.length ? rows : h("div", { class: "empty" }, r.lines.length ? "Nothing at this level." : "The log is empty."));
}

// Discord-flavoured markdown -> DOM, built from text nodes only (replies come from models and web pages).
function inlineMd(text, out) {
  const re = /(`[^`\n]+`)|\|\|(.+?)\|\||\*\*(.+?)\*\*|__(.+?)__|~~(.+?)~~|\*([^*\n]+)\*|\b_([^_\n]+)_\b|\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)|<(https?:\/\/[^>\s]+)>|(https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"])|<t:(-?\d+)(?::([tTdDfFR]))?>/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.append(text.slice(last, m.index));
    last = re.lastIndex;
    if (m[1]) out.append(h("code", {}, m[1].slice(1, -1)));
    else if (m[2] != null) { const s = h("span", { class: "spoiler", title: "Tap to reveal" }); inlineMd(m[2], s); s.addEventListener("click", () => s.classList.add("shown")); out.append(s); }
    else if (m[3] != null) { const b = h("b"); inlineMd(m[3], b); out.append(b); }
    else if (m[4] != null) { const u = h("u"); inlineMd(m[4], u); out.append(u); }
    else if (m[5] != null) { const s = h("s"); inlineMd(m[5], s); out.append(s); }
    else if (m[6] != null || m[7] != null) { const i = h("i"); inlineMd(m[6] ?? m[7], i); out.append(i); }
    else if (m[8] != null) out.append(h("a", { href: m[9], target: "_blank", rel: "noopener noreferrer" }, m[8]));
    else if (m[10] || m[11]) { const u = m[10] || m[11]; out.append(h("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, u)); }
    else if (m[12]) {
      const ts = +m[12], st = m[13] || "f";
      out.append(h("span", { title: new Date(ts * 1000).toLocaleString() }, st === "R" ? (ts > nowS() ? until(ts) : ago(ts))
        : st === "t" || st === "T" ? clock(ts) : when(ts)));
    }
  }
  if (last < text.length) out.append(text.slice(last));
  return out;
}
function md(text) {
  const root = h("div", { class: "md" });
  const parts = String(text || "").split(/```/);
  parts.forEach((part, k) => {
    if (k % 2 === 1) {  // code block; the first line may name the language
      const body = part.replace(/^[\w+-]*\n/, "");
      root.append(h("pre", {}, h("code", {}, body.replace(/\n$/, ""))));
      return;
    }
    let para = null;
    for (const line of part.split("\n")) {
      let el = null, content = line;
      if (/^-# /.test(line)) { el = h("p", { class: "grey" }); content = line.slice(3); }
      else if (/^#{1,3} /.test(line)) { el = h("p", { class: "h" }); content = line.replace(/^#{1,3} /, ""); }
      else if (/^>>?>? ?/.test(line)) { el = h("p", { class: "quote" }); content = line.replace(/^>>?>? ?/, ""); }
      else if (/^\s*[-*] /.test(line)) { el = h("p"); content = line.replace(/^(\s*)[-*] /, "$1• "); }
      if (el) { inlineMd(content, el); root.append(el); para = null; continue; }
      if (!line.trim()) { para = null; continue; }
      if (!para) { para = h("p"); root.append(para); } else para.append("\n");
      inlineMd(line, para);
    }
  });
  return root;
}

function applyChat(data) {
  const stick = nearBottom() || C.v === 0;
  for (const id of data.removed || []) { C.els.get(id)?.remove(); C.els.delete(id); C.rows.delete(id); }
  for (const row of data.messages) {
    const el = msgEl(row);
    const old = C.els.get(row.id);

    else { const w = $("working"); if (w) w.before(el); else $("msgs").append(el); }

async function sendChat(ev) {

  if (!text.trim() && !C.files.length) return;
  const fd = new FormData();
  fd.append("text", text);
  for (const f of C.files) fd.append("file", f, f.name);
  $("chat-send").disabled = true; C.sending = true;
  try {
    const r = await fetch(`/api/chats/${C.id}/send`, { method: "POST", credentials: "same-origin", body: fd });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || data.error) throw new Error(data.error || "HTTP " + r.status);
    input.value = ""; C.files = []; renderAttached(); autosize();
    C.typing = true; renderWorking();
  } catch (err) { toast("Not sent: " + err.message); }
  finally { $("chat-send").disabled = false; setTimeout(() => (C.sending = false), 3000); pollChat(); }
}

// voice input: record -> the PC's Whisper -> text in the box (edit, then send). Browsers only allow the
// microphone on https (or localhost); on plain http the button opens the phone's own recorder instead.
C.rec = null;
const canRecord = () => window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder;
async function transcribeBlob(blob, name) {
  const mic = $("chat-mic");
  mic.classList.add("busy"); mic.disabled = true; mic.textContent = "…";
  try {
    const fd = new FormData();
    fd.append("audio", blob, name);
    const r = await fetch("/api/transcribe", { method: "POST", credentials: "same-origin", body: fd });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || data.error) throw new Error(data.error || "HTTP " + r.status);
    if (!data.text) { toast("Didn't catch any words."); return; }
    const t = $("chat-input");
    t.value = (t.value.trim() ? t.value.trimEnd() + " " : "") + data.text;
    autosize(); t.focus();
  } catch (err) { toast("Voice: " + err.message); }
  finally { mic.classList.remove("busy"); mic.disabled = false; mic.textContent = "🎙️"; }
}
async function toggleRecord() {
  const mic = $("chat-mic");
  if (C.rec) { C.rec.stop(); return; }
  if (!canRecord()) {
    if (C.httpsPort && location.protocol === "http:") {
      toast(`Live recording needs the https page: https://${location.hostname}:${C.httpsPort} (accept the warning once). Opening your phone's recorder instead.`);
    }
    $("chat-audio").click();
    return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (err) { toast("No microphone access: " + err.message); return; }
  const rec = new MediaRecorder(stream);
  const chunks = [], started = Date.now();
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    clearInterval(rec.tick); C.rec = null; mic.classList.remove("rec"); mic.textContent = "🎙️";
    const type = rec.mimeType || chunks[0]?.type || "audio/webm";
    const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
    if (Date.now() - started > 400 && chunks.length) transcribeBlob(new Blob(chunks, { type }), "voice." + ext);
  };
  rec.tick = setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000);
    mic.textContent = `■ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    if (s >= 170) rec.stop();  // the bot's voice limit is 180 s (VOICE_MAX_SECONDS)
  }, 250);
  C.rec = rec; mic.classList.add("rec"); mic.textContent = "■ 0:00";
  rec.start();
}

$("chat-audio").addEventListener("change", (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) transcribeBlob(f, f.name); });
$("chat-attach").addEventListener("click", () => $("chat-files").click());
$("chat-files").addEventListener("change", (e) => { C.files.push(...e.target.files); e.target.value = ""; renderAttached(); });
$("chat-pick").addEventListener("change", (e) => openChat(e.target.value));
$("chat-new").addEventListener("click", async () => {
  try { const r = await postJSON("/api/chats", {}); await loadChats(r.chat.id); $("chat-input").focus(); } catch (err) { toast(err.message); }
});
$("chat-panel").addEventListener("click", () => { $("chat-input").value = "/panel"; sendChat(new Event("submit")); });
$("chat-engine").addEventListener("click", () => $("chat-panel").click());
$("chat-more").addEventListener("click", async () => {
  const cur = C.chats.find((c) => c.id === C.id);
  const name = prompt("Rename this chat (or type DELETE to delete it):", cur ? cur.title : "");
  if (name == null || !name.trim()) return;
  try {
    if (name.trim() === "DELETE") { await postJSON(`/api/chats/${C.id}/delete`); C.id = null; try { localStorage.removeItem("chat"); } catch (e) {} await loadChats(null); }
    else { await postJSON(`/api/chats/${C.id}/rename`, { title: name.trim() }); await loadChats(C.id); }
  } catch (err) { toast(err.message); }
});
window.addEventListener("resize", sizeChat);

// ---- wiring
function chips(el, items, current, onpick) {
  put(el, items.map(([key, label]) => h("button", { class: key === current ? "on" : null, onclick: () => onpick(key) }, label)));
}
function setFilter(k) { S.filter = k; chips($("filters"), FILTERS, k, setFilter); renderFeed(); }
function setLogLevel(k) { S.logLevel = k; chips($("log-filters"), LOG_LEVELS, k, setLogLevel); loadLog(); }
function show(tab) {
  S.tab = tab;
  for (const b of $("tabs").children) b.classList.toggle("on", b.dataset.tab === tab);
  for (const s of document.querySelectorAll("main > section")) s.classList.toggle("on", s.id === tab);
  try { localStorage.setItem("tab", tab); } catch (e) {}
  if (tab === "jobs") loadJobs(false).catch(() => {});
  if (tab === "log") loadLog().catch(() => {});
  if (tab === "activity" && S.events.length < 60 && !S.noMore) loadOlder().catch(() => {});
  document.body.classList.toggle("chatting", tab === "chat");
  if (S.state && tab === "now") tick();  // the Now tab needs fresh machine/model stats (other tabs poll "lite")
  if (tab === "chat") {
    sizeChat();
    if (C.id) pollChat(); else loadChats(null).catch((err) => { put($("msgs"), h("div", { class: "empty" }, err.message)); });
  }
  render();
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.tab); });
$("q").addEventListener("input", (e) => { S.q = e.target.value; renderFeed(); });
$("older").addEventListener("click", () => loadOlder().catch(() => {}));
$("older-jobs").addEventListener("click", () => loadJobs(true).catch(() => {}));
chips($("filters"), FILTERS, S.filter, setFilter);
chips($("log-filters"), LOG_LEVELS, S.logLevel, setLogLevel);

// Refresh pace: every 3 s on the Now tab (live progress, CPU/GPU), every 10 s elsewhere (the Chat tab polls its own
// messages), paused while the page is hidden. Jobs refresh every 30 s.
let timer = null, lastJobs = 0, gen = 0;
async function tick() {
  const mine = ++gen;  // a newer tick (tab switch, page shown again) takes over the schedule
  clearTimeout(timer);
  if (document.hidden) return;
  await poll();
  if (mine !== gen) return;
  if (S.tab === "jobs" && Date.now() - lastJobs > 30000) { lastJobs = Date.now(); loadJobs(false).catch(() => {}); }
  if (S.tab === "log") loadLog().catch(() => {});
  timer = setTimeout(tick, S.tab === "now" ? 3000 : 10000);
}
function start() { tick(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) { start(); if (S.tab === "chat") pollChat(); } });
let saved = "now";
try { saved = localStorage.getItem("tab") || "now"; } catch (e) {}
sizeChat();
show(["chat", "now", "activity", "jobs", "schedule", "log"].includes(saved) ? saved : "now");
start();
</script>
</body>
</html>
